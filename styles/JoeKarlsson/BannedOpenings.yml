extends: existence
message: "Banned opening or cliche: '%s'. Start with the actual point."
level: error
ignorecase: true
tokens:
  - "in today's world"
  - "in today's rapidly"
  - 'in the ever-evolving'
  - 'in the realm of'
  - 'when it comes to'
  - "it's no secret"
  - 'as we all know'
  - 'imagine if'
  - 'have you ever wondered'
  - 'transform your'
  - 'harness the power'
  - 'embark on a journey'
  - 'say goodbye to'
  - 'in this article, we will'
  - 'this guide will show you'
  - "let's take a look at"
  - 'before we dive in'
  - 'without further ado'
  - 'to make it concrete'
  - "here's what it actually is"
  - "here's what it is"
  # Influencer and marketing cliches missing from every other list (from the
  # post-writer skill's avoid list, Joe 2026-11-10).
  - 'stop scrolling'
  - "you won't believe"
  - 'mind blown'
  - 'real talk'
  - 'bookmark this'
  - 'i cried writing this'
  - 'to the (?:person|one) who needs to hear this'
  - 'work smarter'
  - 'drive efficiency'
  - 'maximize roi'
